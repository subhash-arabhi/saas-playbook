name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Build the tarball and checksums
        run: |
          tarball="$(npm pack --silent)"
          sha256sum "$tarball" > SHA256SUMS
          project="$(mktemp -d)"
          bash install.sh "$project" > /dev/null
          checksum="$(node -p "require('$project/.agents/playbook.json').checksum")"
          echo "$checksum  content (the checksum installs record in .agents/playbook.json)" >> SHA256SUMS
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## $GITHUB_REF_NAME" 'index($0, v) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          # shellcheck disable=SC2016 # the backticks are Markdown
          printf '\n**Content checksum:** `%s`\n\nCheck the tarball with `sha256sum --check SHA256SUMS --ignore-missing` and `gh attestation verify %s --repo %s`.\n' \
            "$CHECKSUM" "$TARBALL" "$GITHUB_REPOSITORY" >> notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.TARBALL }}
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$TARBALL" SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
